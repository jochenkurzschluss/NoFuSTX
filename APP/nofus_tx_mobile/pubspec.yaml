name: nofus_tx_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.02.1+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_background_service: ^5.0.7
  flutter_local_notifications: ^17.2.3  # Falls noch nicht da, kurz hinzufügen
  path_provider: ^2.1.3
  

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  geolocator: ^13.0.2
  sqflite: ^2.4.2+1
  http: ^1.6.0
  path: ^1.8.3
  permission_handler: ^12.0.2
  connectivity_plus: ^7.1.1
  flutter_blue_plus: ^1.34.0
  protobuf: ^4.2.0
  
  meshtastic_flutter: ^0.0.3
  uuid: ^4.5.3
  intl: ^0.20.2
  package_info_plus: ^8.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# === HIER IST DIE KONFIGURATION FÜR DEIN APP-SYMBOL ===
flutter_launcher_icons:
  android: true  # <-- GEÄNDERT von "launcher_icon" auf true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Hier registrieren wir den Ordner, damit die App dein Symbol auch findet
  assets:
    - assets/icons/